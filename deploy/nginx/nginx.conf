worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_request_id"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    # El árbol del PIDE son 48 KB de JSON y viaja en cada pantalla.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # El límite de ingresos es por dirección IP, y una universidad entera sale
    # a internet por una sola: con 5 por minuto, la sexta persona que entra en
    # la mañana se queda fuera sin haber hecho nada malo. Los intentos
    # fallidos de una cuenta los sigue frenando la propia API, cuenta por
    # cuenta (LOGIN_MAX_ATTEMPTS). Esto de aquí sólo corta la fuerza bruta.
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=120r/m;

    # DNS de Docker: vuelve a resolver la API si cambia su IP al recrearse.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        location = /nginx-health {
            access_log off;
            return 200 'ok';
        }
    }

    server {
        listen 80;
        server_name testeo.tech www.testeo.tech;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        set $planeacion_api http://api:8000;
        http2 on;
        server_name testeo.tech www.testeo.tech;

        ssl_certificate     /etc/letsencrypt/live/testeo.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/testeo.tech/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location /health {
            proxy_pass $planeacion_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1/auth/login {
            limit_req zone=auth_limit burst=60 nodelay;
            proxy_pass $planeacion_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass $planeacion_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_read_timeout 60s;
        }

        location = /openapi.json {
            proxy_pass $planeacion_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /docs {
            proxy_pass $planeacion_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Todo lo demás es el sitio, que vive en su propio contenedor.
        location / {
            set $planeacion_web http://web:80;
            proxy_pass $planeacion_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
