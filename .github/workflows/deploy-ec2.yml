name: Deploy Backend To EC2

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  quality:
    name: Tests And Lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: planeacion_test
          POSTGRES_USER: planeacion_test
          POSTGRES_PASSWORD: planeacion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planeacion_test -d planeacion_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://planeacion_test:planeacion_test@127.0.0.1:5432/planeacion_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check app tests alembic

      - name: Migrations
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: python -m alembic upgrade head

      - name: Tests
        run: python -m pytest -q

  deploy:
    name: Deploy To EC2
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
          DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: DEPLOY_BRANCH,DEPLOY_PATH
          script_stop: true
          script: |
            set -euo pipefail

            DEPLOY_PATH="${DEPLOY_PATH:-/opt/planeacion-api}"
            if [ ! -d "$DEPLOY_PATH" ]; then
              echo "ERROR: no existe el directorio de despliegue: $DEPLOY_PATH"
              exit 1
            fi
            cd "$DEPLOY_PATH"

            echo "==> Actualizando branch: $DEPLOY_BRANCH"
            git fetch origin "$DEPLOY_BRANCH"
            git reset --hard "origin/$DEPLOY_BRANCH"

            echo "==> Verificando .env existente en la VPS"
            if [ ! -s .env ]; then
              echo "ERROR: no existe $DEPLOY_PATH/.env o esta vacio"
              exit 1
            fi
            chmod 600 .env

            echo "==> Validando configuracion de Docker Compose"
            docker compose -f docker-compose.prod.yml config --quiet

            echo "==> Construyendo imagen de la API"
            docker compose -f docker-compose.prod.yml build api

            echo "==> Ejecutando migraciones Alembic"
            docker compose -f docker-compose.prod.yml run --rm api alembic upgrade head

            echo "==> Levantando API y Nginx"
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "==> Esperando health check"
            for i in $(seq 1 30); do
              HEALTH_RESPONSE="$(curl -fsS --resolve testeo.tech:443:127.0.0.1 https://testeo.tech/health || true)"
              if echo "$HEALTH_RESPONSE" | grep -q '"database":"connected"'; then
                echo "OK - servicio respondiendo"
                exit 0
              fi
              sleep 2
            done

            echo "FAILED - la API no respondio. Logs recientes:"
            docker compose -f docker-compose.prod.yml logs --tail 100 api nginx
            exit 1
