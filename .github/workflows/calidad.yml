name: Pruebas y calidad

# El despliegue a EC2 ya corre estas mismas comprobaciones en main y develop.
# Aquí se corren en las ramas de trabajo y en los pull requests, que es donde
# hasta ahora no se corrían solas.

on:
  push:
    branches-ignore: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calidad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Ruff y pruebas
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: planeacion_test
          POSTGRES_USER: planeacion_test
          POSTGRES_PASSWORD: planeacion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planeacion_test -d planeacion_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://planeacion_test:planeacion_test@127.0.0.1:5432/planeacion_test
    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar las dependencias
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check app tests alembic

      - name: Migraciones
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: python -m alembic upgrade head

      - name: Pruebas
        run: python -m pytest -q
